</head>

<body class="bg-background text-foreground">

    <div class="min-h-screen flex w-full">
        <!-- Sidebar -->
        <aside id="app-sidebar"
            class="relative transition-[width] duration-300 hidden lg:flex flex-col w-64 h-screen sticky top-0 bg-primary text-primary-foreground">

            </div>

            <button id="sidebar-toggle" onclick="toggleSidebar()"
                class="absolute -right-3 top-20 h-6 w-6 rounded-full bg-accent text-accent-foreground hover:bg-accent/80 shadow-md flex items-center justify-center transition-colors z-50 cursor-pointer border border-border">

                    Principal</div>
                <a href="dashboard-admin.html"

                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="sidebar-text truncate">

                <a href="admin-archivador.html"

                    <i data-lucide="file-text" class="w-4 h-4"></i><span class="sidebar-text truncate">
                        Archivador
                    </span></a>
                <a href="admin-reportes.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg bg-accent text-accent-foreground font-medium">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span class="sidebar-text truncate">

                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10 ">

                    </span></a>

                <div class="mt-auto pt-4 border-t border-primary-foreground/10">
                    <a href="index.html"
                        class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-destructive-foreground hover:bg-destructive/20">
                        <i data-lucide="log-out" class="w-4 h-4"></i><span class="sidebar-text truncate">
                            Cerrar Sesión
                        </span></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header
                class="h-16 bg-card border-b border-border flex items-center justify-between px-6 gap-4 sticky top-0 z-10">
                <div class="relative flex-1 max-w-md hidden md:flex">
                    <i data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
                    <input type="text" placeholder="Buscar documentos, proyectos..."
                        class="flex h-10 w-full rounded-md border border-input bg-muted/50 px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 pl-10 border-0">
                </div>
                <!-- Mobile Menu Button (kept from original logic) -->
                <button class="lg:hidden p-2 rounded-md hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center gap-4 ml-auto lg:ml-0">
                    <!-- Notification Bell with Dropdown -->
                    <div class="relative">
                        <button id="notification-btn" onclick="toggleNotifications()"
                            class="inline-flex items-center justify-center rounded-md text-sm font-medium hover:bg-accent hover:text-accent-foreground h-10 w-10 relative">
                            <i data-lucide="bell" class="h-5 w-5"></i>
                            <span id="notification-count"
                                class="absolute -top-1 -right-1 h-4 w-4 bg-destructive text-destructive-foreground text-xs rounded-full flex items-center justify-center">0</span>
                        </button>
                        <div id="notification-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-3 border-b flex items-center justify-between">
                                <h4 class="font-semibold">Notificaciones</h4>
                                <a href="admin-avisos.html" class="text-sm text-blue-600 hover:underline">Ver todas</a>
                            </div>
                            <div id="notification-list" class="max-h-80 overflow-y-auto"></div>
                        </div>
                    </div>

                    <!-- User Profile Dropdown -->
                    <div class="relative">
                        <button id="user-menu-btn" onclick="toggleUserMenu()"
                            class="inline-flex items-center gap-2 hover:bg-accent hover:text-accent-foreground p-2 rounded-md transition-colors">
                            <span class="relative flex h-8 w-8 shrink-0 overflow-hidden rounded-full">
                                <span id="user-initials"
                                    class="flex h-full w-full items-center justify-center rounded-full bg-primary text-primary-foreground font-medium">--</span>
                            </span>
                            <span id="user-short-name" class="hidden md:inline text-sm font-medium">Cargando...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 hidden md:block"></i>
                        </button>
                        <div id="user-menu-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 240px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-4 border-b">
                                <p id="user-full-name" class="font-semibold">Cargando...</p>
                                <p id="user-email" class="text-sm text-gray-500">--</p>
                                <span id="user-role-badge"
                                    class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 mt-2">--</span>
                            </div>
                            <div class="p-2">
                                <a href="index.html"
                                    class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-6 lg:p-8 overflow-auto">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold">Reportes</h1>
                        <p class="text-muted-foreground">Genera y descarga reportes del sistema</p>
                    </div>
                    <div>
                        <select
                            class="flex h-10 w-full items-center justify-between rounded-lg border border-input bg-background px-3 py-2.5 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="todos">Todos</option>
                            <option value="proyectos">Proyectos</option>
                            <option value="financiero">Financiero</option>
                            <option value="documentos">Documentos</option>
                        </select>
                    </div>
                </div>

                <!-- Reports Grid -->
                <div id="reportes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Injected via script logic here -->
                </div>

            </main>
        </div>
    </div>

    <script src="config.js"></script>`n    <script src="script.js"></script>
    <script>
        // API_BASE is defined in script.js

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function () {
            lucide.createIcons();

            const reportes = [
                { id: 'proyectos', titulo: "Reporte de Proyectos Activos", desc: "Resumen de proyectos en curso", tipo: "Proyectos", icon: "bar-chart-3" },
                { id: 'documentos', titulo: "Reporte de Documentación", desc: "Listado completo de documentos", tipo: "Documentos", icon: "file-text" },
                { id: 'presupuestos', titulo: "Análisis de Presupuestos", desc: "Comparativa estimados vs ejecutados", tipo: "Financiero", icon: "pie-chart" },
                { id: 'estadisticas', titulo: "Estadísticas Generales", desc: "Resumen de estadísticas del sistema", tipo: "General", icon: "file-spreadsheet" },
                { id: 'ejecutivo', titulo: "Reporte Mensual Ejecutivo", desc: "Resumen ejecutivo de operaciones", tipo: "General", icon: "file-text" },
            ];

            const grid = document.getElementById('reportes-grid');
            if (grid) {
                reportes.forEach((r, index) => {
                    const card = document.createElement('div');
                    card.className = "rounded-lg border bg-card text-card-foreground shadow-sm hover:shadow-md transition-all";
                    card.innerHTML = `
                        <div class="flex flex-col space-y-1.5 p-6 pb-3">
                            <div class="flex items-start justify-between">
                                <div class="p-2 bg-muted rounded-lg">
                                    <i data-lucide="${r.icon}" class="h-6 w-6 text-primary"></i>
                                </div>
                                <span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold bg-muted text-foreground">${r.tipo}</span>
                            </div>
                            <h3 class="font-semibold leading-none tracking-tight text-lg mt-3">${r.titulo}</h3>
                             <p class="text-sm text-muted-foreground">${r.desc}</p>
                        </div>
                        <div class="p-6 pt-0">
                             <div class="flex items-center justify-between mt-4">
                                <div class="flex items-center gap-2 text-sm text-gray-400">
                                    <i data-lucide="calendar" class="h-4 w-4"></i>
                                    <span>${new Date().toLocaleDateString('es-PE')}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="generateReport('${r.id}')" class="px-3 py-2.5 bg-black text-primary-foreground rounded text-sm hover:bg-gray-800 flex items-center gap-2">
                                        <i data-lucide="file-text" class="w-4 h-4"></i> Generar
                                    </button>
                                </div>
                             </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                lucide.createIcons();
            }
        });

        async function generateReport(reportId) {
            try {
                let reportData = {};
                let reportTitle = '';
                let reportContent = '';

                switch (reportId) {
                    case 'proyectos':
                        reportTitle = 'Reporte de Proyectos Activos';
                        const proyectos = await fetch(`${API_BASE}/projects`).then(r => r.json());
                        reportData = proyectos;
                        reportContent = generateProjectsReport(proyectos);
                        break;
                    case 'documentos':
                        reportTitle = 'Reporte de Documentación';
                        const docs = await fetch(`${API_BASE}/documents`).then(r => r.json());
                        reportData = docs;
                        reportContent = generateDocumentsReport(docs);
                        break;
                    case 'presupuestos':
                        reportTitle = 'Análisis de Presupuestos';
                        const projects = await fetch(`${API_BASE}/projects`).then(r => r.json());
                        reportData = projects;
                        reportContent = generateBudgetReport(projects);
                        break;
                    case 'estadisticas':
                        reportTitle = 'Estadísticas Generales';
                        const docStats = await fetch(`${API_BASE}/documents/stats`).then(r => r.json());
                        const projList = await fetch(`${API_BASE}/projects`).then(r => r.json());
                        reportData = { docStats, projList };
                        reportContent = generateStatsReport(docStats, projList);
                        break;
                    case 'ejecutivo':
                        reportTitle = 'Reporte Mensual Ejecutivo';
                        const [exec_docs, exec_projs] = await Promise.all([
                            fetch(`${API_BASE}/documents/stats`).then(r => r.json()),
                            fetch(`${API_BASE}/projects`).then(r => r.json())
                        ]);
                        reportContent = generateExecutiveReport(exec_docs, exec_projs);
                        break;
                    default:
                        reportTitle = 'Reporte General';
                        reportContent = '<p>Este reporte está en desarrollo.</p>';
                }

                openReportWindow(reportTitle, reportContent);
            } catch (error) {
                console.error('Error generating report:', error);
                alert('Error al generar el reporte: ' + error.message);
            }
        }

        function generateProjectsReport(proyectos) {
            return `
                <h2>Resumen de Proyectos</h2>
                <p class="summary">Total de proyectos: <strong>${proyectos.length}</strong></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th>Jefe de Proyecto</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${proyectos.map(p => `
                            <tr>
                                <td>PRY-${String(p.id_proyecto).padStart(3, '0')}</td>
                                <td>${p.nombre}</td>
                                <td><span class="status" style="background-color: ${p.color || '#6b7280'}">${p.estado_nombre || 'Sin estado'}</span></td>
                                <td>${p.jefe_nombre || '-'}</td>
                                <td>${formatDate(p.fecha_inicio)}</td>
                                <td>${formatDate(p.fecha_fin)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function generateDocumentsReport(docs) {
            return `
                <h2>Listado de Documentos</h2>
                <p class="summary">Total de documentos: <strong>${docs.length}</strong></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Proyecto</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${docs.map(d => `
                            <tr>
                                <td>DOC-${String(d.id_documento).padStart(3, '0')}</td>
                                <td>${d.titulo}</td>
                                <td>${d.tipo_nombre || 'Sin tipo'}</td>
                                <td><span class="status" style="background-color: ${d.estado_color || '#6b7280'}">${d.estado_nombre || 'Sin estado'}</span></td>
                                <td>${d.proyecto_nombre || '-'}</td>
                                <td>${formatDate(d.fecha_registro)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function generateBudgetReport(projects) {
            return `
                <h2>Análisis de Presupuestos por Proyecto</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Proyecto</th>
                            <th>Estado</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${projects.map(p => `
                            <tr>
                                <td>${p.nombre}</td>
                                <td><span class="status" style="background-color: ${p.color || '#6b7280'}">${p.estado_nombre || '-'}</span></td>
                                <td>${formatDate(p.fecha_inicio)}</td>
                                <td>${formatDate(p.fecha_fin)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <p class="note">* Para ver presupuestos detallados, acceda a cada proyecto individual.</p>
            `;
        }

        function generateStatsReport(docStats, projList) {
            return `
                <h2>Estadísticas del Sistema</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Documentos</h3>
                        <p class="stat-number">${docStats.totalDocumentos || 0}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Proyectos</h3>
                        <p class="stat-number">${projList.length || 0}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Almacenamiento</h3>
                        <p class="stat-number">${formatFileSize(docStats.tamañoTotalArchivos || 0)}</p>
                    </div>
                </div>
                <h3>Documentos por Estado</h3>
                <table>
                    <thead>
                        <tr><th>Estado</th><th>Cantidad</th></tr>
                    </thead>
                    <tbody>
                        ${(docStats.documentosPorEstado || []).map(e => `
                            <tr>
                                <td><span class="status" style="background-color: ${e.color || '#6b7280'}">${e.nombre}</span></td>
                                <td>${e.cantidad}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function generateExecutiveReport(docStats, projects) {
            const activeProjects = projects.filter(p => p.estado_nombre && p.estado_nombre.toLowerCase().includes('activo')).length;
            return `
                <h2>Reporte Ejecutivo - ${new Date().toLocaleDateString('es-PE', { month: 'long', year: 'numeric' })}</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Proyectos</h3>
                        <p class="stat-number">${projects.length}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Proyectos Activos</h3>
                        <p class="stat-number">${activeProjects}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Documentos</h3>
                        <p class="stat-number">${docStats.totalDocumentos || 0}</p>
                    </div>
                </div>
                <h3>Resumen de Proyectos</h3>
                <table>
                    <thead>
                        <tr><th>Proyecto</th><th>Estado</th><th>Prioridad</th></tr>
                    </thead>
                    <tbody>
                        ${projects.slice(0, 10).map(p => `
                            <tr>
                                <td>${p.nombre}</td>
                                <td><span class="status" style="background-color: ${p.color || '#6b7280'}">${p.estado_nombre || '-'}</span></td>
                                <td>${p.prioridad_nombre || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function openReportWindow(title, content) {
            const reportWindow = window.open('', '_blank');
            reportWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${title} - ACCUBoss</title>
                    <style>
                        * { box-sizing: border-box; }
                        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; max-width: 1000px; margin: 0 auto; }
                        h1 { color: #1a1a2e; border-bottom: 2px solid #1a1a2e; padding-bottom: 10px; }
                        h2 { color: #333; margin-top: 30px; }
                        h3 { color: #555; margin-top: 25px; }
                        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
                        .header img { height: 50px; }
                        .print-btn { background: #1a1a2e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
                        .print-btn:hover { background: #2d2d4d; }
                        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                        th, td { border: 1px solid #ddd; padding: 12px 8px; text-align: left; }
                        th { background: #f5f5f5; font-weight: 600; }
                        tr:nth-child(even) { background: #fafafa; }
                        .status { color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
                        .summary { font-size: 16px; margin: 20px 0; color: #666; }
                        .note { font-size: 12px; color: #888; font-style: italic; margin-top: 20px; }
                        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
                        .stat-card { background: #f5f5f5; padding: 20px; border-radius: 10px; text-align: center; }
                        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; }
                        .stat-number { font-size: 32px; font-weight: bold; color: #1a1a2e; margin: 0; }
                        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #888; text-align: center; }
                        @media print {
                            .print-btn { display: none; }
                            body { padding: 20px; }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>${title}</h1>
                        <div>
                            <button class="print-btn" onclick="window.print()">🖨 Imprimir</button>
                            <button class="print-btn" onclick="window.close()">✕ Cerrar</button>
                        </div>
                    </div>
                    <p>Generado el: ${new Date().toLocaleString('es-PE')}</p>
                    ${content}
                    <div class="footer">
                        <p>Reporte generado por ACCUBoss - Sistema de Gestión de Proyectos de Construcción</p>
                    </div>
                </body>
                </html>
            `);
            reportWindow.document.close();
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // ===== HEADER FUNCTIONALITY =====
        const HEADER_API = API_ROOT; // Uses config.js

        function toggleNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            if (dropdown.style.display === 'block') loadNotifications();
        }

        function toggleUserMenu() {
            const dropdown = document.getElementById('user-menu-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        async function loadNotifications() {
            const list = document.getElementById('notification-list');
            const badge = document.getElementById('notification-count');
            list.innerHTML = '<p class="p-4 text-center text-gray-500">Cargando...</p>';
            try {
                const response = await fetch(`${HEADER_API}/api/notifications?limit=10`);
                const data = await response.json();
                const notifications = Array.isArray(data) ? data : (data.notifications || []);

                const unreadCount = notifications.filter(n => !n.leido).length;
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }

                const toShow = notifications.filter(n => !n.leido).slice(0, 5);
                if (toShow.length > 0) {
                    list.innerHTML = toShow.map(n => `
                        <div class="p-3 border-b hover:bg-gray-50 cursor-pointer" onclick="window.location.href='admin-avisos.html'">
                            <p class="font-medium text-sm truncate">${n.titulo || n.mensaje}</p>
                            <p class="text-xs text-gray-500">${n.fecha_creacion ? new Date(n.fecha_creacion).toLocaleDateString('es-PE') : '-'}</p>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p class="p-4 text-center text-gray-500">No hay notificaciones sin leer</p>';
                }
            } catch (e) { list.innerHTML = '<p class="p-4 text-center text-gray-500">Error al cargar</p>'; }
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch(`${HEADER_API}/api/users/me`, { credentials: 'include' });
                const user = await response.json();
                const initials = (user.nombre?.charAt(0) || 'A') + (user.apellido?.charAt(0) || 'D');
                document.getElementById('user-initials').textContent = initials.toUpperCase();
                document.getElementById('user-short-name').textContent = user.nombre || 'Usuario';
                document.getElementById('user-full-name').textContent = `${user.nombre || ''} ${user.apellido || ''}`.trim();
                document.getElementById('user-email').textContent = user.correo || '';
                const rolLabels = { 'admin': 'Administrador', 'jefe': 'Jefe de Proyecto', 'operativo': 'Operativo' };
                document.getElementById('user-role-badge').textContent = rolLabels[user.rol] || user.rol || 'Usuario';
            } catch (e) { console.error('Error loading user:', e); }
        }

        document.addEventListener('click', function (e) {
            const notifDropdown = document.getElementById('notification-dropdown');
            const notifBtn = document.getElementById('notification-btn');
            if (notifDropdown && notifBtn && !notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) notifDropdown.style.display = 'none';
            const userDropdown = document.getElementById('user-menu-dropdown');
            const userBtn = document.getElementById('user-menu-btn');
            if (userDropdown && userBtn && !userDropdown.contains(e.target) && !userBtn.contains(e.target)) userDropdown.style.display = 'none';
        });

        loadCurrentUser();
        loadNotifications();
    </script>
</body>

</html>
