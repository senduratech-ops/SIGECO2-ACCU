<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - ACCUBoss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <script src="tailwind-config.js"></script>
</head>

<body class="bg-background text-foreground">

    <div class="min-h-screen flex w-full">
        <!-- Sidebar -->
        <aside id="app-sidebar"
            class="relative transition-[width] duration-300 hidden lg:flex flex-col w-64 h-screen sticky top-0 bg-primary text-primary-foreground">
            <div class="h-16 flex items-center px-6 border-b border-primary-foreground/10">
                <span
                    class="text-3xl font-extrabold tracking-tight sidebar-title overflow-hidden whitespace-nowrap">ACCU</span>
            </div>
            <button id="sidebar-toggle" onclick="toggleSidebar()"
                class="absolute -right-3 top-20 h-6 w-6 rounded-full bg-accent text-accent-foreground hover:bg-accent/80 shadow-md flex items-center justify-center transition-colors z-50 cursor-pointer border border-border">
                <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
            <div class="flex-1 py-4 flex flex-col gap-1 px-3">
                <div class="px-3 mb-2 text-xs font-semibold text-primary-foreground/70 uppercase tracking-wider">Menú
                    Principal</div>
                <a href="dashboard-admin.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span
                        class="sidebar-text truncate">Dashboard</span></a>
                <a href="admin-proyectos.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg bg-accent text-accent-foreground font-medium">
                    <i data-lucide="folder-open" class="w-4 h-4"></i><span
                        class="sidebar-text truncate">Proyectos</span></a>
                <a href="admin-archivador.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10">
                    <i data-lucide="file-text" class="w-4 h-4"></i><span
                        class="sidebar-text truncate">Archivador</span></a>
                <a href="admin-reportes.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span
                        class="sidebar-text truncate">Reportes</span></a>
                <a href="admin-avisos.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10">
                    <i data-lucide="bell" class="w-4 h-4"></i><span class="sidebar-text truncate">Avisos</span></a>
                <div class="mt-auto pt-4 border-t border-primary-foreground/10">
                    <a href="index.html"
                        class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-destructive-foreground hover:bg-destructive/20">
                        <i data-lucide="log-out" class="w-4 h-4"></i><span class="sidebar-text truncate">Cerrar
                            Sesión</span></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header
                class="h-16 bg-card border-b border-border flex items-center justify-between px-6 gap-4 sticky top-0 z-10">
                <div class="relative flex-1 max-w-md hidden md:flex">
                    <i data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
                    <input type="text" id="search-input" placeholder="Buscar proyecto..."
                        class="flex h-10 w-full rounded-md border border-input bg-muted/50 px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring pl-10 border-0">
                </div>
                <button class="lg:hidden p-2 rounded-md hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center gap-4 ml-auto lg:ml-0">
                    <!-- Notification Bell with Dropdown -->
                    <div class="relative">
                        <button id="notification-btn" onclick="toggleNotifications()"
                            class="inline-flex items-center justify-center rounded-md text-sm font-medium hover:bg-accent hover:text-accent-foreground h-10 w-10 relative">
                            <i data-lucide="bell" class="h-5 w-5"></i>
                            <span id="notification-count"
                                class="absolute -top-1 -right-1 h-4 w-4 bg-destructive text-destructive-foreground text-xs rounded-full flex items-center justify-center">0</span>
                        </button>
                        <div id="notification-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-3 border-b flex items-center justify-between">
                                <h4 class="font-semibold">Notificaciones</h4>
                                <a href="admin-avisos.html" class="text-sm text-blue-600 hover:underline">Ver todas</a>
                            </div>
                            <div id="notification-list" class="max-h-80 overflow-y-auto"></div>
                        </div>
                    </div>

                    <!-- User Profile Dropdown -->
                    <div class="relative">
                        <button id="user-menu-btn" onclick="toggleUserMenu()"
                            class="inline-flex items-center gap-2 hover:bg-accent hover:text-accent-foreground p-2 rounded-md transition-colors">
                            <span class="relative flex h-8 w-8 shrink-0 overflow-hidden rounded-full">
                                <span id="user-initials"
                                    class="flex h-full w-full items-center justify-center rounded-full bg-primary text-primary-foreground font-medium">--</span>
                            </span>
                            <span id="user-short-name" class="hidden md:inline text-sm font-medium">Cargando...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 hidden md:block"></i>
                        </button>
                        <div id="user-menu-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 240px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-4 border-b">
                                <p id="user-full-name" class="font-semibold">Cargando...</p>
                                <p id="user-email" class="text-sm text-gray-500">--</p>
                                <span id="user-role-badge"
                                    class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 mt-2">--</span>
                            </div>
                            <div class="p-2">
                                <a href="index.html"
                                    class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-6 lg:p-8 overflow-auto">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold">Proyectos</h1>
                        <p class="text-muted-foreground">Gestiona todos los proyectos de construcción</p>
                    </div>
                    <div class="flex gap-3">
                        <select id="filter-status"
                            class="flex h-10 rounded-lg border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring">
                            <option value="">Todos los estados</option>
                        </select>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="flex items-center justify-center py-12">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-muted-foreground"></i>
                </div>

                <!-- Projects Grid -->
                <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-12">
                    <i data-lucide="folder-open" class="w-12 h-12 mx-auto text-muted-foreground mb-4"></i>
                    <h3 class="text-lg font-semibold mb-2">No hay proyectos</h3>
                    <p class="text-muted-foreground mb-4">Los proyectos son creados por los Jefes de Proyecto</p>
                </div>
            </main>
        </div>
    </div>


    <script src="config.js"></script>`n    <script src="script.js"></script>
    <script>
        // API_BASE is already defined in script.js
        let allProjects = [];
        let statuses = [];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadInitialData();

            document.getElementById('search-input').addEventListener('input', filterProjects);
            document.getElementById('filter-status').addEventListener('change', filterProjects);
        });

        async function loadInitialData() {
            try {
                await Promise.all([
                    loadStatuses(),
                    loadProjects()
                ]);
            } catch (error) {
                console.error('Error loading initial data:', error);
            }
        }

        async function loadStatuses() {
            const response = await fetch(`${API_BASE}/project-statuses`);
            statuses = await response.json();

            const filterSelect = document.getElementById('filter-status');

            statuses.forEach(s => {
                filterSelect.innerHTML += `<option value="${s.id_estado}">${s.nombre}</option>`;
            });
        }

        async function loadProjects() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('projects-grid').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/projects`);
                allProjects = await response.json();
                renderProjects(allProjects);
            } catch (error) {
                console.error('Error loading projects:', error);
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
            }
        }

        function renderProjects(projects) {
            const grid = document.getElementById('projects-grid');
            const empty = document.getElementById('empty-state');

            if (!projects || projects.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            empty.classList.add('hidden');

            const statusColors = {
                'Planificación': 'bg-yellow-500',
                'En Progreso': 'bg-blue-500',
                'En Pausa': 'bg-orange-500',
                'Completado': 'bg-green-500',
                'Cancelado': 'bg-red-500'
            };

            grid.innerHTML = projects.map(p => `
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm group cursor-pointer hover:shadow-lg transition-all duration-200 hover:border-blue-200"
                     onclick="viewProject(${p.id_proyecto})">
                    <div class="h-32 bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center border-b rounded-t-lg">
                        <i data-lucide="building-2" class="w-12 h-12 text-gray-400"></i>
                    </div>
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="font-semibold text-lg group-hover:text-blue-600 transition-colors line-clamp-1">${p.nombre}</h3>
                            <div class="w-3 h-3 rounded-full ${statusColors[p.estado_nombre] || 'bg-gray-400'}" title="${p.estado_nombre || 'Sin estado'}"></div>
                        </div>
                        <p class="text-sm text-muted-foreground mb-3 line-clamp-2">${p.descripcion || 'Sin descripción'}</p>
                        <div class="flex items-center justify-between">
                            <span class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold bg-card text-foreground border-border">
                                ${p.estado_nombre || 'Sin estado'}
                            </span>
                        </div>
                        <div class="mt-3 pt-3 border-t text-xs text-muted-foreground flex justify-between">
                            <span><i data-lucide="file-text" class="w-3 h-3 inline mr-1"></i>${p.num_documentos || 0} docs</span>
                            <span><i data-lucide="user" class="w-3 h-3 inline mr-1"></i>${p.jefe_nombre || 'Sin asignar'}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function filterProjects() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('filter-status').value;

            let filtered = allProjects;

            if (search) {
                filtered = filtered.filter(p =>
                    p.nombre.toLowerCase().includes(search) ||
                    (p.descripcion && p.descripcion.toLowerCase().includes(search))
                );
            }

            if (status) {
                filtered = filtered.filter(p => p.id_estado == status);
            }

            renderProjects(filtered);
        }

        function viewProject(id) {
            window.location.href = `admin-proyecto-detalle.html?id=${id}`;
        }

        // ===== HEADER FUNCTIONALITY =====
        const HEADER_API = API_ROOT; // Uses config.js

        // Toggle notifications
        function toggleNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            if (dropdown.style.display === 'block') loadNotifications();
        }

        // Toggle user menu
        function toggleUserMenu() {
            const dropdown = document.getElementById('user-menu-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        // Load notifications
        async function loadNotifications() {
            const list = document.getElementById('notification-list');
            const badge = document.getElementById('notification-count');
            list.innerHTML = '<p class="p-4 text-center text-gray-500">Cargando...</p>';
            try {
                const response = await fetch(`${HEADER_API}/api/notifications?limit=10`);
                const data = await response.json();
                const notifications = Array.isArray(data) ? data : (data.notifications || []);

                // Count only unread
                const unreadCount = notifications.filter(n => !n.leido).length;
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }

                const toShow = notifications.filter(n => !n.leido).slice(0, 5);
                if (toShow.length > 0) {
                    list.innerHTML = toShow.map(n => `
                        <div class="p-3 border-b hover:bg-gray-50 cursor-pointer" onclick="window.location.href='admin-avisos.html'">
                            <p class="font-medium text-sm truncate">${n.titulo || n.mensaje}</p>
                            <p class="text-xs text-gray-500">${n.fecha_creacion ? new Date(n.fecha_creacion).toLocaleDateString('es-PE') : '-'}</p>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p class="p-4 text-center text-gray-500">No hay notificaciones sin leer</p>';
                }
            } catch (e) { list.innerHTML = '<p class="p-4 text-center text-gray-500">Error al cargar</p>'; }
        }

        // Load current user
        async function loadCurrentUser() {
            try {
                const response = await fetch(`${HEADER_API}/api/users/me`, { credentials: 'include' });
                const user = await response.json();
                const initials = (user.nombre?.charAt(0) || 'A') + (user.apellido?.charAt(0) || 'D');
                document.getElementById('user-initials').textContent = initials.toUpperCase();
                document.getElementById('user-short-name').textContent = user.nombre || 'Usuario';
                document.getElementById('user-full-name').textContent = `${user.nombre || ''} ${user.apellido || ''}`.trim();
                document.getElementById('user-email').textContent = user.correo || '';
                const rolLabels = { 'admin': 'Administrador', 'jefe': 'Jefe de Proyecto', 'operativo': 'Operativo' };
                document.getElementById('user-role-badge').textContent = rolLabels[user.rol] || user.rol || 'Usuario';
            } catch (e) { console.error('Error loading user:', e); }
        }

        // Close dropdowns on outside click
        document.addEventListener('click', function (e) {
            const notifDropdown = document.getElementById('notification-dropdown');
            const notifBtn = document.getElementById('notification-btn');
            if (notifDropdown && notifBtn && !notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) {
                notifDropdown.style.display = 'none';
            }
            const userDropdown = document.getElementById('user-menu-dropdown');
            const userBtn = document.getElementById('user-menu-btn');
            if (userDropdown && userBtn && !userDropdown.contains(e.target) && !userBtn.contains(e.target)) {
                userDropdown.style.display = 'none';
            }
        });

        loadCurrentUser();
        loadNotifications();
    </script>
</body>

</html>
