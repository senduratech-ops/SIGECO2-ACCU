                <a href="operativo-mano-obra.html"

                    <i data-lucide="hammer" class="w-4 h-4"></i><span class="sidebar-text truncate">

                <a href="operativo-reportes.html"

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header

                <div class="relative flex-1 max-w-md hidden md:flex">
                    <i data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
                    <input type="text" id="search-input" placeholder="Buscar material..."
                        class="flex h-10 w-full rounded-md border border-input bg-muted/50 px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 pl-10 border-0">
                </div>
                <!-- Mobile Menu Button (kept from original logic) -->
                <button class="lg:hidden p-2 rounded-md hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center gap-4 ml-auto lg:ml-0">
                    <!-- Notification Bell with Dropdown -->
                    <div class="relative">
                        <button id="notification-btn" onclick="toggleNotifications()"

                            <i data-lucide="bell" class="h-5 w-5"></i>
                            <span id="notification-count"
                                class="absolute -top-1 -right-1 h-4 w-4 bg-destructive text-destructive-foreground text-xs rounded-full flex items-center justify-center"
                                style="display:none">0</span>
                        </button>
                        <!-- Dropdown -->
                        <div id="notification-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-3 border-b flex items-center justify-between">
                                <h4 class="font-semibold">Notificaciones</h4>
                            </div>
                            <div id="notification-list" class="max-h-80 overflow-y-auto">
                                <!-- Notifications loaded here -->
                            </div>
                        </div>
                    </div>

                    <!-- User Profile Dropdown -->
                    <div class="relative">
                        <button id="user-menu-btn" onclick="toggleUserMenu()"
                            class="inline-flex items-center gap-2 hover:bg-accent hover:text-accent-foreground p-2 rounded-md transition-colors">
                            <span class="relative flex h-8 w-8 shrink-0 overflow-hidden rounded-full">
                                <span id="user-initials"
                                    class="flex h-full w-full items-center justify-center rounded-full bg-primary text-primary-foreground font-medium">
                                    --
                                </span>
                            </span>
                            <span id="user-short-name" class="hidden md:inline text-sm font-medium">Cargando...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 hidden md:block"></i>
                        </button>
                        <!-- User Dropdown -->
                        <div id="user-menu-dropdown"
                            style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 240px; background: white; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e5e7eb; z-index: 50;">
                            <div class="p-4 border-b">
                                <p id="user-full-name" class="font-semibold">Cargando...</p>
                                <p id="user-email" class="text-sm text-gray-500">--</p>
                                <span id="user-role-badge"
                                    class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 mt-2">--</span>
                            </div>
                            <div class="p-2">
                                <a href="index.html"
                                    class="flex items-center gap-3 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-6 lg:p-8 overflow-auto">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-bold tracking-tight text-foreground">Inventario de Materiales</h1>
                        <p class="text-muted-foreground mt-1">Gestión de stock y proveedores</p>
                    </div>
                    <button id="btn-add-material" type="button" onclick="openCreateModal()"
                        class="inline-flex items-center justify-center rounded-lg text-sm font-medium bg-black text-primary-foreground h-10 px-4 py-2 gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Agregar Material
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="materials-grid">
                    <!-- Injected -->
                </div>

            </main>
        </div>
    </div>

    <!-- Modal para Agregar/Editar Material -->
    <div id="material-modal" style="display: none;"
        class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-card text-card-foreground rounded-lg shadow-xl w-full max-w-md border border-border"
            id="modal-content">
            <div class="p-6 border-b border-border flex justify-between items-center">
                <h3 class="text-xl font-bold" id="modal-title">Agregar Material</h3>
                <button onclick="closeModal()" class="text-muted-foreground hover:text-foreground">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="material-form" onsubmit="handleMaterialSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="material-id">

                <div class="space-y-2">
                    <label class="text-sm font-medium">Nombre del Material</label>
                    <input type="text" id="material-name" required
                        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Tipo / Categoría</label>
                        <select id="material-type"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                            <option value="Obra Gruesa">Obra Gruesa</option>
                            <option value="Estructuras">Estructuras</option>
                            <option value="Albañilería">Albañilería</option>
                            <option value="Terminaciones">Terminaciones</option>
                            <option value="Pisos">Pisos</option>
                            <option value="Tabiquería">Tabiquería</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Unidad Medida</label>
                        <select id="material-unit"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                            <option value="Unidades">Unidades</option>
                            <option value="Bolsas">Bolsas</option>
                            <option value="m2">m²</option>
                            <option value="m3">m³</option>
                            <option value="Kg">Kg</option>
                            <option value="Litros">Litros</option>
                            <option value="Tinetas">Tinetas</option>
                            <option value="Varillas">Varillas</option>
                            <option value="Planchas">Planchas</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Stock Actual</label>
                        <input type="number" id="material-stock" min="0" required
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium">Precio Unitario</label>
                        <input type="number" id="material-price" min="0" step="0.01"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()"
                        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>`n    <script src="script.js"></script>
    <script src="common-header.js"></script>
</body>
<script>
    // API_BASE is already defined in script.js

    // Mapeo de iconos por categoría para mantener diseño
    const categoryIcons = {
        "Obra Gruesa": "box",
        "Estructuras": "layers",
        "Albañilería": "align-justify",
        "Terminaciones": "droplet",
        "Pisos": "grid",
        "Tabiquería": "layout",
        "Otros": "package"
    };

    let allMaterials = [];

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        loadMaterials();

        // Search Logic
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allMaterials.filter(m =>
                    m.nombre.toLowerCase().includes(term) ||
                    m.tipo.toLowerCase().includes(term)
                );
                renderMaterials(filtered);
            });
        }
        lucide.createIcons();

        // Event listener assignment moved to HTML for reliability
        // const addBtn = document.getElementById('btn-add-material'); ...
    });

    // Cargar materiales desde API
    async function loadMaterials() {
        const grid = document.getElementById('materials-grid');
        if (!grid) return;

        grid.innerHTML = '<p class="col-span-3 text-center text-muted-foreground">Cargando materiales...</p>';

        try {
            // Removing credentials: 'include' to avoid CORS issues with file:// protocol
            const response = await fetch(`${API_BASE}/materials`);
            if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

            allMaterials = await response.json();
            renderMaterials(allMaterials);

        } catch (error) {
            console.error("Error cargando materiales:", error);
            grid.innerHTML = `<p class="col-span-3 text-center text-destructive">Error al cargar inventario: ${error.message}. <br> Intenta cargar la página desde localhost.</p>`;
            alert('Error conectando al servidor: ' + error.message);
        }
    }

    // Renderizar Grid
    function renderMaterials(materials) {
        const grid = document.getElementById('materials-grid');
        if (!grid) return;

        grid.innerHTML = '';

        if (materials.length === 0) {
            grid.innerHTML = '<p class="col-span-3 text-center text-muted-foreground">No hay materiales registrados.</p>';
            return;
        }

        materials.forEach(m => {
            const icon = categoryIcons[m.tipo] || "package";
            const precio = parseFloat(m.precio_unitario || 0).toLocaleString('es-PE', { style: 'currency', currency: 'PEN' });

            const card = document.createElement('div');
            card.className = "rounded-lg border bg-card p-6 shadow-sm hover:shadow-md transition-all";
            card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                             <div class="p-2 bg-muted rounded-lg text-muted-foreground">
                                <i data-lucide="${icon}" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full bg-muted text-muted-foreground self-center">${m.tipo || 'General'}</span>
                        </div>
                        
                        <div class="relative group">
                            <button class="h-8 w-8 flex items-center justify-center hover:bg-accent hover:text-accent-foreground rounded-full text-muted-foreground transition-colors">
                                <i data-lucide="more-vertical" class="w-4 h-4"></i>
                            </button>
                            <div class="absolute right-0 top-8 w-40 bg-popover text-popover-foreground border rounded-md shadow-lg z-10 hidden group-hover:block hover:block">
                                <button onclick="openEditModal(${m.id_material})" class="w-full text-left px-4 py-2 text-sm hover:bg-accent hover:text-accent-foreground transition-colors">Editar</button>
                                <button onclick="deleteMaterial(${m.id_material})" class="w-full text-left px-4 py-2 text-sm text-destructive hover:bg-destructive/10 transition-colors">Eliminar</button>
                            </div>
                        </div>
                    </div>
                    
                    <h3 class="font-bold text-lg mb-1">${m.nombre}</h3>
                    
                    <div class="space-y-2 mt-4">
                         <div class="flex justify-between text-sm border-b border-border/50 pb-2">
                            <span class="text-muted-foreground">Stock Actual</span>
                            <span class="font-medium">${m.stock_actual}</span>
                        </div>
                        <div class="flex justify-between text-sm border-b border-border/50 pb-2">
                            <span class="text-muted-foreground">Unidad (UM)</span>
                            <span class="font-medium">${m.unidad_medida}</span>
                        </div>
                        <div class="flex justify-between text-sm pt-1">
                            <span class="text-muted-foreground">Precio Unitario</span>
                            <span class="font-medium">${precio}</span>
                        </div>
                    </div>
                `;
            grid.appendChild(card);
        });
        lucide.createIcons();
    }

    // --- Gestión del Modal ---

    function toggleModal(show) {
        const modal = document.getElementById('material-modal');
        if (show) {
            modal.style.display = 'flex';
        } else {
            modal.style.display = 'none';
        }
    }

    function openCreateModal() {
        try {
            const title = document.getElementById('modal-title');
            const form = document.getElementById('material-form');
            const idInput = document.getElementById('material-id');

            if (!title) throw new Error("No se encuentra el elemento 'modal-title'");
            if (!form) throw new Error("No se encuentra el elemento 'material-form'");
            if (!idInput) throw new Error("No se encuentra el elemento 'material-id'");

            title.textContent = 'Agregar Material';
            form.reset();
            idInput.value = '';
            toggleModal(true);
        } catch (err) {
            alert("Error interno al abrir modal: " + err.message);
            console.error(err);
        }
    }

    function openEditModal(id) {
        const material = allMaterials.find(m => m.id_material === id);
        if (!material) return;

        document.getElementById('modal-title').textContent = 'Editar Material';
        document.getElementById('material-id').value = material.id_material;
        document.getElementById('material-name').value = material.nombre;
        document.getElementById('material-type').value = material.tipo;
        document.getElementById('material-unit').value = material.unidad_medida;
        document.getElementById('material-stock').value = material.stock_actual;
        document.getElementById('material-price').value = material.precio_unitario;

        toggleModal(true);
    }

    function closeModal() {
        toggleModal(false);
    }

    // --- Submit ---
    async function handleMaterialSubmit(e) {
        e.preventDefault();

        const id = document.getElementById('material-id').value;
        const data = {
            nombre: document.getElementById('material-name').value,
            tipo: document.getElementById('material-type').value,
            unidad_medida: document.getElementById('material-unit').value,
            stock_actual: parseInt(document.getElementById('material-stock').value),
            precio_unitario: parseFloat(document.getElementById('material-price').value)
        };

        const url = id ? `${API_BASE}/materials/${id}` : `${API_BASE}/materials`;
        const method = id ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                closeModal();
                loadMaterials(); // Recargar grid
            } else {
                alert('Error al guardar material');
            }
        } catch (error) {
            console.error("Error saving:", error);
            alert("Error de conexión");
        }
    }

    // --- Eliminar ---
    async function deleteMaterial(id) {
        if (!confirm("¿Seguro que deseas eliminar este material?")) return;

        try {
            const response = await fetch(`${API_BASE}/materials/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadMaterials();
            } else {
                alert('Error al eliminar');
            }
        } catch (error) {
            console.error(error);
            alert("Error de conexión");
        }
    }
</script>
</body>
