<!DOCTYPE html>
<html lang="es">

<head>

<body class="bg-background text-foreground">

    <div class="min-h-screen flex w-full">

            <div class="flex-1 py-4 flex flex-col gap-1 px-3">

                <a href="dashboard-admin.html"

                <a href="admin-proyectos.html"

                <a href="admin-archivador.html"

                    <i data-lucide="file-text" class="w-4 h-4"></i><span

                <a href="admin-reportes.html"
                    class="flex items-center gap-3 px-3 py-2.5 font-medium rounded-lg text-primary-foreground hover:bg-primary-foreground/10">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span

                <a href="admin-avisos.html"

                <div class="mt-auto pt-4 border-t border-primary-foreground/10">

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header

                <div class="relative flex-1 max-w-md hidden md:flex">
                    <i data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
                    <input type="text" placeholder="Buscar avisos..."

                </div>
                <button class="lg:hidden p-2 rounded-md hover:bg-accent hover:text-accent-foreground">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-4 ml-auto lg:ml-0">
                    <!-- User Profile Dropdown -->
                    <div class="relative">
                        <button id="user-menu-btn" onclick="toggleUserMenu()"

                            <span class="relative flex h-8 w-8 shrink-0 overflow-hidden rounded-full">

                                    class="flex h-full w-full items-center justify-center rounded-full bg-primary text-primary-foreground font-medium">--</span>
                            </span>
                            <span id="user-short-name" class="hidden md:inline text-sm font-medium">Cargando...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 hidden md:block"></i>
                        </button>
                        <div id="user-menu-dropdown"

                            <div class="p-4 border-b">
                                <p id="user-full-name" class="font-semibold">Cargando...</p>
                                <p id="user-email" class="text-sm text-gray-500">--</p>
                                <span id="user-role-badge"
                                    class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 mt-2">--</span>
                            </div>
                            <div class="p-2">
                                <a href="index.html"

                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    Cerrar Sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-6 lg:p-8 overflow-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold">Avisos</h1>
                        <p class="text-muted-foreground">Gestión de notificaciones y alertas del sistema</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="markAllRead()"
                            class="inline-flex items-center justify-center rounded-lg text-sm font-medium border border-input bg-background hover:bg-accent h-10 px-4 py-2 gap-2">
                            <i data-lucide="check-check" class="w-4 h-4"></i>
                            Marcar todo leído
                        </button>
                        <button onclick="openCreateModal()"
                            class="inline-flex items-center justify-center rounded-lg text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Crear Aviso
                        </button>
                    </div>
                </div>

                <div class="space-y-6">
                    <div
                        class="inline-flex h-10 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground w-fit">
                        <button data-tab="todos" onclick="switchTab('todos')"
                            class="tab-btn active inline-flex items-center justify-center rounded-sm px-3 py-1.5 text-sm font-medium">Todos</button>
                        <button data-tab="no-leidos" onclick="switchTab('no-leidos')"
                            class="tab-btn inline-flex items-center justify-center rounded-sm px-3 py-1.5 text-sm font-medium hover:bg-background/50">No
                            leídos</button>
                        <button data-tab="alertas" onclick="switchTab('alertas')"
                            class="tab-btn inline-flex items-center justify-center rounded-sm px-3 py-1.5 text-sm font-medium hover:bg-background/50">Alertas</button>
                    </div>

                    <!-- Loading -->
                    <div id="loading-state" class="flex justify-center py-8">
                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-muted-foreground"></i>
                    </div>

                    <!-- Avisos List -->
                    <div id="avisos-list" class="space-y-3 hidden"></div>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden text-center py-12">
                        <i data-lucide="bell-off" class="w-12 h-12 mx-auto text-muted-foreground mb-4"></i>
                        <h3 class="text-lg font-semibold mb-2">No hay avisos</h3>
                        <p class="text-muted-foreground">No tienes notificaciones en este momento</p>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Modal Nuevo Aviso -->
    <div id="aviso-modal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4">
        <div class="bg-card text-card-foreground p-6 rounded-lg w-full max-w-md shadow-lg border border-border">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">Crear Nuevo Aviso</h3>
                <button onclick="closeModal()" class="text-muted-foreground hover:text-foreground">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="aviso-form" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium">Mensaje *</label>
                    <textarea id="aviso-msg" required rows="3"
                        class="flex w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
                        placeholder="Escriba el mensaje del aviso..."></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium">Tipo</label>
                    <select id="aviso-type"
                        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm">
                        <option value="info">Información</option>
                        <option value="alerta">Alerta</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="exito">Éxito</option>
                    </select>
                </div>
                <div class="pt-4 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 border border-input rounded-md hover:bg-accent">Cancelar</button>
                    <button type="submit"
                        class="px-4 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>`n    <script src="script.js"></script>
    <script>
        // API_BASE is already defined in script.js
        let allNotifications = [];
        let currentTab = 'todos';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadNotifications();
            document.getElementById('aviso-form').addEventListener('submit', handleSubmit);
        });

        async function loadNotifications() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('avisos-list').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/notifications`);
                allNotifications = await response.json();
                filterAndRender();
            } catch (error) {
                console.error('Error loading notifications:', error);
                // Mostrar datos de ejemplo si falla
                allNotifications = [
                    { id_notificacion: 1, mensaje: 'Nuevo documento agregado al proyecto Mall Centro Comercial', tipo: 'info', leido: false, fecha: new Date().toISOString() },
                    { id_notificacion: 2, mensaje: 'Presupuesto pendiente de aprobación', tipo: 'pendiente', leido: false, fecha: new Date().toISOString() },
                    { id_notificacion: 3, mensaje: 'Plazo de entrega próximo a vencer', tipo: 'alerta', leido: true, fecha: new Date().toISOString() }
                ];
                filterAndRender();
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
            }
        }

        function filterAndRender() {
            let filtered = allNotifications;

            if (currentTab === 'no-leidos') {
                filtered = allNotifications.filter(n => !n.leido);
            } else if (currentTab === 'alertas') {
                filtered = allNotifications.filter(n => n.tipo === 'alerta');
            }

            renderNotifications(filtered);
        }

        function renderNotifications(notifications) {
            const list = document.getElementById('avisos-list');
            const empty = document.getElementById('empty-state');

            if (!notifications || notifications.length === 0) {
                list.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            list.classList.remove('hidden');
            empty.classList.add('hidden');

            const typeIcons = {
                'info': { icon: 'info', color: 'bg-blue-100 text-blue-600' },
                'alerta': { icon: 'alert-triangle', color: 'bg-red-100 text-red-600' },
                'pendiente': { icon: 'clock', color: 'bg-yellow-100 text-yellow-600' },
                'exito': { icon: 'check-circle', color: 'bg-green-100 text-green-600' }
            };

            list.innerHTML = notifications.map(n => {
                const config = typeIcons[n.tipo] || typeIcons.info;
                return `
                    <div class="rounded-lg border bg-card p-4 shadow-sm ${!n.leido ? 'border-l-4 border-l-blue-500' : ''}">
                        <div class="flex items-start gap-4">
                            <div class="p-2 rounded-full ${config.color}">
                                <i data-lucide="${config.icon}" class="w-5 h-5"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm ${!n.leido ? 'font-semibold' : ''}">${n.mensaje}</p>
                                <div class="flex items-center gap-4 mt-2 text-xs text-muted-foreground">
                                    <span><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${formatDate(n.fecha)}</span>
                                    <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-xs capitalize">${n.tipo}</span>
                                </div>
                            </div>
                            <div class="flex gap-1">
                                ${!n.leido ? `
                                    <button onclick="markAsRead(${n.id_notificacion})" class="p-2 hover:bg-accent rounded" title="Marcar como leído">
                                        <i data-lucide="check" class="w-4 h-4"></i>
                                    </button>
                                ` : ''}
                                <button onclick="deleteNotification(${n.id_notificacion})" class="p-2 hover:bg-destructive/20 rounded text-destructive" title="Eliminar">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tab) btn.classList.add('active');
            });
            filterAndRender();
        }

        async function markAsRead(id) {
            try {
                await fetch(`${API_BASE}/notifications/${id}/read`, { method: 'PUT' });
                loadNotifications();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function markAllRead() {
            try {
                await fetch(`${API_BASE}/notifications/read-all`, { method: 'PUT' });
                loadNotifications();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteNotification(id) {
            if (!confirm('¿Eliminar esta notificación?')) return;
            try {
                await fetch(`${API_BASE}/notifications/${id}`, { method: 'DELETE' });
                loadNotifications();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function openCreateModal() {
            document.getElementById('aviso-form').reset();
            document.getElementById('aviso-modal').classList.remove('hidden');
            document.getElementById('aviso-modal').classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('aviso-modal').classList.add('hidden');
            document.getElementById('aviso-modal').classList.remove('flex');
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const data = {
                mensaje: document.getElementById('aviso-msg').value,
                tipo: document.getElementById('aviso-type').value
            };

            try {
                const response = await fetch(`${API_BASE}/notifications`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeModal();
                    loadNotifications();
                } else {
                    alert('Error al crear el aviso');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al crear el aviso');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'Ahora';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Ahora';
            if (diffMins < 60) return `Hace ${diffMins} min`;
            if (diffMins < 1440) return `Hace ${Math.floor(diffMins / 60)} horas`;
            return date.toLocaleDateString('es-PE', { day: '2-digit', month: 'short' });
        }

        // ===== USER MENU FUNCTIONALITY =====
        const HEADER_API = API_ROOT; // Uses config.js

        function toggleUserMenu() {
            const dropdown = document.getElementById('user-menu-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        async function loadCurrentUser() {
            try {
                const response = await fetch(`${HEADER_API}/api/users/me`, { credentials: 'include' });
                const user = await response.json();
                const initials = (user.nombre?.charAt(0) || 'A') + (user.apellido?.charAt(0) || 'D');
                document.getElementById('user-initials').textContent = initials.toUpperCase();
                document.getElementById('user-short-name').textContent = user.nombre || 'Usuario';
                document.getElementById('user-full-name').textContent = `${user.nombre || ''} ${user.apellido || ''}`.trim();
                document.getElementById('user-email').textContent = user.correo || '';
                const rolLabels = { 'admin': 'Administrador', 'jefe': 'Jefe de Proyecto', 'operativo': 'Operativo' };
                document.getElementById('user-role-badge').textContent = rolLabels[user.rol] || user.rol || 'Usuario';
            } catch (e) { console.error('Error loading user:', e); }
        }

        document.addEventListener('click', function (e) {
            const userDropdown = document.getElementById('user-menu-dropdown');
            const userBtn = document.getElementById('user-menu-btn');
            if (userDropdown && userBtn && !userDropdown.contains(e.target) && !userBtn.contains(e.target)) userDropdown.style.display = 'none';
        });

        loadCurrentUser();
    </script>
</body>
